[package]
name = "rbac"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bcrypt = "0.19.3"
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "4.4", features = ["derive"] }
dotenvy = "0.15.7"
getset = "0.1.7"
jsonwebtoken = "9.0.0"
rpassword = "7.3"
serde = { version = "1.0.229", features = ["derive"] }
surrealdb = { version = "3.3.1", features = ["protocol-ws"] }
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
serde_json = "1.0"
