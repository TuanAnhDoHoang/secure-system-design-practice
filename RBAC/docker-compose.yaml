services:
  surrealdb:
    image: surrealdb/surrealdb:v3.3.1
    container_name: surrealdb
    restart: unless-stopped
    user: root
    command: >
      start
      --bind 0.0.0.0:8000
      --user ${SURREALDB_USERNAME:-root}
      --pass ${SURREALDB_PASSWORD:-secret}
      surrealkv:/data/database
    environment:
      SURREALDB_USERNAME: ${SURREALDB_USERNAME:-root}
      SURREALDB_PASSWORD: ${SURREALDB_PASSWORD:-secret}
    ports:
      - "8000:8000"
    volumes:
      - surrealdb_data:/data
    healthcheck:
      test: ["CMD", "/surreal", "isready", "--endpoint", "http://localhost:8000"]
      interval: 5s
      timeout: 3s
      retries: 10

  rbac:
    build: .
    container_name: rbac
    restart: unless-stopped
    depends_on:
      surrealdb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Đổi tên biến cho khớp với code trong src/ (state.rs / main.rs)
      SURREALDB_WS: surrealdb
      SURREALDB_PORT: 8000
      SURREALDB_USERNAME: ${SURREALDB_USERNAME:-root}
      SURREALDB_PASSWORD: ${SURREALDB_PASSWORD:-secret}
    ports:
      - "3000:3000"

volumes:
  surrealdb_data: