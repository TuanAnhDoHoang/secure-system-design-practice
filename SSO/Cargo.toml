[package]
name = "SSO"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
askama = "0.16.1"
axum = {version="0.8.9", features=["macros"]}
base64 = "0.22"
bcrypt = "0.17.0"
chrono = "0.4.45"
dotenv = "0.15.0"
getset = "0.1.7"
jsonwebtoken = {version="11.1.0", features=["aws_lc_rs"]}
lettre = "0.11.23"
log = "0.4.34"
env_logger = "0.11"
redis = {version="1.7.0", features=["tokio-comp", "connection-manager"]}
regex = "1.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
surrealdb = { version = "3.3.1", features = ["protocol-ws"] }
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.8.0", features = ["v4", "serde"] }
