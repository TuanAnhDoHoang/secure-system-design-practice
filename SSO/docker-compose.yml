services:
  surrealdb:
    image: surrealdb/surrealdb:latest
    container_name: surrealdb
    ports:
      - "8000:8000" # HTTP + WebSocket (SurrealDB serves both on the same port)
    environment:
      SURREAL_ENV: "dev"
      SURREAL_KV: "memory"
    command: start --user root --pass root memory

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    ports:
      - "1025:1025"   # SMTP — point SMTP_SERVER here
      - "8025:8025"   # Web UI to read captured emails


  server:
    build: .
    container_name: sso-server
    depends_on:
      - surrealdb
      - redis
    environment:
      SURREALDB_HOST: surrealdb
      SURREALDB_PORT: 8000
      SURREALDB_USERNAME: root
      SURREALDB_PASSWORD: root
      SURREALDB_NAMESPACE: test
      SURREALDB_NAME: test
      VERIFICATION_LINK: "http://localhost:3000/verify"
      HOST_URL: "http://localhost:3000"
    ports:
      - "3000:3000"
